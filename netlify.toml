# Everything portable (fetching content, installing web/, Node version, TZ) lives in the
# root package.json, .nvmrc and .npmrc, so any host that runs `npm run build` and serves
# web/out works. See README.md, "Deploying".
[build]
  command = "npm run build"
  publish = "web/out"

[build.environment]
  # The site is a static export, so the Next.js runtime plugin (for server rendering) is not needed.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
